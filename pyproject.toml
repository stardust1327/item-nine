[project]
name = "nfl-prediction-engine"
version = "0.1.0"
description = "NFL game prediction engine and weekly scouting report"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
